name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build app bundle
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug, warnings visible)
        run: swift build -c debug

      - name: Generate icon
        run: ./Tools/make-icon.sh

      - name: Build app bundle
        run: ./build.sh release

      - name: Check bundle is signed and sandboxed
        run: |
          codesign --verify --verbose build/OctoStatusBar.app
          codesign --display --entitlements - build/OctoStatusBar.app

      - uses: actions/upload-artifact@v4
        with:
          name: OctoStatusBar-app
          path: build/OctoStatusBar.app
