# XcodeGen spec — generates OctoStatusBar.xcodeproj for Mac App Store builds.
#
#   brew install xcodegen
#   xcodegen generate
#
# The Swift package remains the source of truth for day-to-day development
# (`swift build`, `./build.sh`); this target compiles exactly the same files.
# The generated .xcodeproj is gitignored on purpose — it is a build artefact.

name: OctoStatusBar

options:
  bundleIdPrefix: io.reneo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    # Bump for every upload — App Store Connect rejects a duplicate build
    # number even when the previous build has been deleted. The marketing
    # version only changes when what users see changes.
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    # Set your Apple Developer Team ID here, or select it in Xcode's
    # Signing & Capabilities tab. Left blank so the repo carries no identity.
    # Note that picking it in Xcode does not survive `xcodegen generate` —
    # the project is a build artefact, so anything that must persist lives here.
    DEVELOPMENT_TEAM: ""
    # Xcode 26's "Update to recommended settings". Mirrored here because
    # accepting that prompt only writes to the generated project.
    DEAD_CODE_STRIPPING: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    STRING_CATALOG_GENERATE_SYMBOLS: true
    EAGER_COMPILATION_ALLOW_SCRIPTS: true

targets:
  OctoStatusBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/OctoStatusBar
      # Must live under `sources` with an explicit buildPhase: XcodeGen has no
      # top-level `resources` key, so declaring it there is silently ignored and
      # the app ships with no Contents/Resources at all. App Store validation
      # then rejects the upload for a missing 512pt@2x icon — which is really a
      # missing icon file, not a malformed one. ./build.sh copies the .icns by
      # hand, so local builds look fine and hide this.
      - path: Resources/AppIcon.icns
        buildPhase: resources
        # Generated by Tools/make-icon.sh; run it before archiving.
        optional: true
    settings:
      base:
        PRODUCT_NAME: OctoStatusBar
        PRODUCT_BUNDLE_IDENTIFIER: io.reneo.OctoStatusBar
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/OctoStatusBar.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        # Xcode 26 expresses entitlements as build settings and generates the
        # plist at build time, which is why OctoStatusBar.entitlements is an
        # empty dict. These two ARE the sandbox: drop them and the App Store
        # rejects the build, and the app silently loses network access.
        ENABLE_APP_SANDBOX: true
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: true
        # main.swift is the entry point; no @main attribute anywhere.
        SWIFT_STRICT_CONCURRENCY: minimal
