# XcodeGen spec — generates OctoStatusBar.xcodeproj for Mac App Store builds.
#
#   brew install xcodegen
#   xcodegen generate
#
# The Swift package remains the source of truth for day-to-day development
# (`swift build`, `./build.sh`); this target compiles exactly the same files.
# The generated .xcodeproj is gitignored on purpose — it is a build artefact.

name: OctoStatusBar

options:
  bundleIdPrefix: io.reneo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set your Apple Developer Team ID here, or select it in Xcode's
    # Signing & Capabilities tab. Left blank so the repo carries no identity.
    DEVELOPMENT_TEAM: ""

targets:
  OctoStatusBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/OctoStatusBar
    resources:
      - path: Resources/AppIcon.icns
        # Generated by Tools/make-icon.sh; run it before archiving.
        optional: true
    settings:
      base:
        PRODUCT_NAME: OctoStatusBar
        PRODUCT_BUNDLE_IDENTIFIER: io.reneo.OctoStatusBar
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/OctoStatusBar.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        # main.swift is the entry point; no @main attribute anywhere.
        SWIFT_STRICT_CONCURRENCY: minimal
